[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screenshot-crawler"
version = "0.1.0"
description = "Site-adapter based Playwright screenshot crawler"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.55,<2",
    "PyYAML>=6,<7",
    "Pillow>=10,<13",
    "jpeglib>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
]

[project.scripts]
screenshot-crawler = "screenshot_crawler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
